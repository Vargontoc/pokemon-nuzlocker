server:
    port: ${SERVER_PORT:8080}

nuzlocke:
    game: fire-red
    pokeapi:
      baseUrl: https://pokeapi.co/api/v2
      request-delay-ms: 500
    emulator:
      enabled: true
      host: localhost
      port: 8888
      poll-interval-ms: 500
      connect-timeout-ms: 1000
      auto-turn: true
spring:
  application:
    name: pokemon-nuzlocker-server
  datasource:
    url: ${URL_BBDD:jdbc:postgresql://localhost:5432/pokemon-nuzlocker}
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate           # el esquema lo gestiona Flyway
  flyway:
    locations: classpath:db/migrations
    baseline-on-migrate: true      # la BD ya tiene la tabla de vectores de Spring AI
    baseline-version: 0            # para que V1 se ejecute igualmente

es.vargontoc.framework.ai:
  base-url: ${URL_OLLAMA:http://localhost:11434/v1}
  default-type: REST
  agents:
    nuzlocke-agent:
      enabled: true
      type: SPRING_AI
      model: nuzlocke-agent
    guide-agent:
      enabled: true
      type: SPRING_AI
      model: guide-agent
      vector-store:
        top-k: 4
        similarity-threshold: 0.5
        pg:
          table-name: guide_content
          dimensions: 1024
          distance: COSINE
          index: HNSW